<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="admin"
      th:with="ehAdmin=${usuarioLogado != null and usuarioLogado.perfil != null and usuarioLogado.perfil.name() == 'ADMIN'},
                st=${noticia != null and noticia.status != null ? noticia.status.name() : 'EM_PRODUCAO'}">
<head th:replace="~{_fragments :: head('Editar notícia — NÚCLEO')}"></head>
<body>
<th:block th:replace="~{_fragments :: chrome('admin')}"></th:block>

<main class="wrap main-flush">
  <div class="admin-shell">
    <aside class="admin-side">
      <p class="side-head">Conteúdo</p>
      <nav>
        <a class="active" th:href="@{/admin}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg> Gerenciar notícias</a>
        <a th:href="@{/cadastrarNoticia}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nova notícia</a>
        <a th:href="@{/cadastrarAutor}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg> Novo autor</a>
      </nav>
    </aside>

    <div class="admin-main" th:if="${noticia != null}">
      <div class="panel-head">
        <h1>Editar notícia</h1>
        <p>Atualize os dados da matéria e salve as alterações.</p>
        <div th:if="${noticia.editadaPorAdmin}" class="mt-badge">
          <span class="badge-admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            Editada por <span th:text="${noticia.editadoPorNome}">admin</span>
            <span th:if="${noticia.dataEdicaoAdmin != null}" th:text="'· ' + ${#temporals.format(noticia.dataEdicaoAdmin,'dd/MM HH:mm')}">· data</span>
          </span>
        </div>
      </div>

      <form class="form-card" method="POST" th:action="@{/editarNoticia(idNoticia=${noticia.id})}">
        <div class="form-grid">
          <div class="field full">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" class="input" type="text" th:value="${noticia.titulo}" required>
          </div>
          <div class="field">
            <label for="assunto">Editoria <span class="hint">(assunto)</span></label>
            <select id="assunto" name="assunto" class="select" required>
              <option th:each="ed : ${ {'Política','Economia','Mundo','Tecnologia','Cultura','Esportes','Ciência'} }"
                      th:value="${ed}" th:text="${ed}" th:selected="${ed == noticia.assunto}">Editoria</option>
            </select>
          </div>
          <div class="field">
            <label for="autor">Autor</label>
            <select id="autor" name="autor.id" class="select" required>
              <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome}"
                      th:selected="${noticia.autor != null and autor.id == noticia.autor.id}">Nome</option>
            </select>
          </div>
          <!-- STATUS: somente ADMIN altera diretamente -->
          <div class="field full" th:if="${ehAdmin}">
            <label for="status">Status</label>
            <select id="status" name="status" class="select">
              <option value="EM_PRODUCAO" th:selected="${st == 'EM_PRODUCAO'}">Em produção</option>
              <option value="INATIVA" th:selected="${st == 'INATIVA'}">Inativa (rascunho)</option>
              <option value="CONCLUIDA" th:selected="${st == 'CONCLUIDA'}">Concluída (publicada)</option>
            </select>
          </div>
          <div class="field full" th:unless="${ehAdmin}">
            <label>Status</label>
            <input type="hidden" name="status" th:value="${st}">
            <div class="status-lock">
              <span class="status-pill"
                    th:classappend="${st == 'CONCLUIDA'} ? 'status-concluida' : (${st == 'INATIVA'} ? 'status-inativa' : 'status-producao')"
                    th:text="${st == 'CONCLUIDA'} ? 'Concluída' : (${st == 'INATIVA'} ? 'Inativa' : 'Em produção')">Status</span>
              <span class="lockmsg">O status é definido pelo administrador.</span>
            </div>
          </div>
          <div class="field full">
            <label for="urlImagem">URL da imagem <span class="hint">(opcional)</span></label>
            <input id="urlImagem" name="urlImagem" class="input" type="url" th:value="${noticia.urlImagem}" placeholder="https://…/foto.jpg">
          </div>
          <div class="field full">
            <label for="conteudo">Conteúdo</label>
            <textarea id="conteudo" name="conteudo" class="textarea" required th:text="${noticia.conteudo}"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg> Salvar alterações</button>
          <a class="btn btn-ghost" th:href="@{/admin}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<th:block th:replace="~{_fragments :: footer}"></th:block>
<th:block th:replace="~{_fragments :: scripts}"></th:block>
</body>
</html>
