<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="login">
<head th:replace="~{_fragments :: head('Entrar — NÚCLEO')}"></head>
<body>
<!--
  POST /login com campos: email, senha.
  Em erro, o controller devolve model.addAttribute("erroLogin", "mensagem").
-->
<div class="auth-stage">
  <div class="auth-card">
    <div class="auth-brand">
      <a class="brand" th:href="@{/}" aria-label="NÚCLEO">
        <span class="brand-mark"></span><span class="wordmark">NÚCLEO</span>
      </a>
      <span class="slogan">Painel da redação</span>
    </div>

    <div th:if="${erroLogin != null}" th:text="${erroLogin}"
         style="background:color-mix(in srgb,var(--ed-cultura) 12%,transparent);color:var(--ed-cultura);font-size:13px;font-weight:600;padding:11px 14px;border-radius:var(--radius-sm);margin-bottom:18px;text-align:center;">
      E-mail ou senha inválidos.
    </div>

    <form method="POST" th:action="@{/login}">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" class="input" type="email" placeholder="nome@nucleo.com.br" required autofocus>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" class="input" type="password" placeholder="••••••••" required>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);font-weight:500;cursor:pointer;">
          <input type="checkbox" name="lembrar" style="width:16px;height:16px;accent-color:var(--blue);"> Manter conectado
        </label>
        <a href="#" style="font-size:13px;color:var(--blue);font-weight:600;">Esqueci a senha</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
        Entrar
      </button>
    </form>

    <p class="auth-hint">
      Acesso restrito à equipe. Cada conta tem um perfil:<br>
      <code>ADMIN</code> gerencia tudo · <code>AUTOR</code> gerencia as próprias matérias.
    </p>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
