<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="login">
<head th:replace="~{_fragments :: head('Entrar — NÚCLEO')}"></head>
<body>
<!--
  POST /login com campos: email, senha.
  Em erro, o controller devolve model.addAttribute("erroLogin", "mensagem").
-->
<div class="auth-stage">
  <div class="auth-card">
    <div class="auth-brand">
      <a class="brand" th:href="@{/}" aria-label="NÚCLEO">
        <span class="brand-mark"></span><span class="wordmark">NÚCLEO</span>
      </a>
      <span class="slogan">Painel da redação</span>
    </div>

    <div th:if="${erroLogin != null}" th:text="${erroLogin}" class="alert alert-error auth-error">
      E-mail ou senha inválidos.
    </div>

    <form method="POST" th:action="@{/login}">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" class="input" type="email" placeholder="nome@nucleo.com.br" required autofocus>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" class="input" type="password" placeholder="••••••••" required>
      </div>
      <div class="auth-options">
        <label class="auth-remember">
          <input type="checkbox" name="lembrar"> Manter conectado
        </label>
        <a href="#" class="auth-forgot">Esqueci a senha</a>
      </div>
      <button type="submit" class="btn btn-primary auth-submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
        Entrar
      </button>
    </form>

    <p class="auth-hint">
      Acesso restrito à equipe. Cada conta tem um perfil:<br>
      <code>ADMIN</code> gerencia tudo · <code>AUTOR</code> gerencia as próprias matérias.
    </p>

    <div class="auth-back">
      <a th:href="@{/}">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para a Home
      </a>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
