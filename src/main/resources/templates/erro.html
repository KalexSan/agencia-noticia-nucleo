<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Erro</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ffcccc, #ffe6e6);
      color: #333;
    }
    .center {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem 3rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      border: 2px solid #ff4d4d;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
      color: #d32f2f;
    }
    p {
      margin: 0;
      color: #555;
    }
    button {
      margin-top: 1.5rem;
      background: #d32f2f;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #b71c1c;
    }
  </style>
</head>	
<body>
  <div class="center">
    <div class="card" role="alert" aria-live="assertive">
      <h1>Algo deu errado</h1>
      <p><span th:text="${motivo}"></span></p>
      <button onclick="window.history.back()">Voltar</button>
    </div>
  </div>
</body>
</html>
