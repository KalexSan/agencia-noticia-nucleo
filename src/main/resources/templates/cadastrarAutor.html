<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="admin">
<head th:replace="~{_fragments :: head('Novo autor — NÚCLEO')}"></head>
<body>
<th:block th:replace="~{_fragments :: chrome('admin')}"></th:block>

<main class="wrap" style="padding:0;">
  <div class="admin-shell">
    <aside class="admin-side">
      <p class="side-head">Conteúdo</p>
      <nav>
        <a th:href="@{/admin}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg> Gerenciar notícias</a>
        <a th:href="@{/cadastrarNoticia}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nova notícia</a>
        <a class="active" th:href="@{/cadastrarAutor}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg> Novo autor</a>
      </nav>
    </aside>

    <div class="admin-main">
      <div class="panel-head">
        <h1>Novo autor</h1>
        <p>Cadastre um colaborador da redação.</p>
      </div>

      <!-- Aviso quando o cadastro vem de uma solicitação aprovada -->
      <div th:if="${preEmail != null}" class="alert alert-info">
        Solicitação aprovada — confira os dados e defina a senha de acesso para concluir o cadastro.
      </div>

      <form class="form-card" method="POST" th:action="@{/cadastrarAutor}">
        <div class="form-grid">
          <div class="field full">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" class="input" type="text" placeholder="Ex.: Helena Vasconcelos"
                   th:value="${preNome}" required>
          </div>
          <div class="field">
            <label for="email">E-mail <span class="hint">(login)</span></label>
            <input id="email" name="email" class="input" type="email" placeholder="nome@nucleo.com.br"
                   th:value="${preEmail}" required>
          </div>
          <div class="field">
            <label for="senha">Senha de acesso</label>
            <input id="senha" name="senha" class="input" type="password" placeholder="••••••••" minlength="6" required>
          </div>
          <div class="field full">
            <label for="dataNascimento">Data de nascimento</label>
            <input id="dataNascimento" name="dataNascimento" class="input" type="date"
                   th:value="${preDataNascimento != null ? #temporals.format(preDataNascimento,'yyyy-MM-dd') : ''}" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg> Cadastrar autor</button>
          <a class="btn btn-ghost" th:href="@{/admin}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<th:block th:replace="~{_fragments :: footer}"></th:block>
<th:block th:replace="~{_fragments :: scripts}"></th:block>
</body>
</html>
