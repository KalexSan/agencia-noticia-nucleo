<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="admin"
      th:with="ehAdmin=${usuarioLogado != null and usuarioLogado.perfil != null and usuarioLogado.perfil.name() == 'ADMIN'}">
<head th:replace="~{_fragments :: head('Nova notícia — NÚCLEO')}"></head>
<body>
<th:block th:replace="~{_fragments :: chrome('admin')}"></th:block>

<main class="wrap main-flush">
  <div class="admin-shell">
    <aside class="admin-side">
      <p class="side-head">Conteúdo</p>
      <nav>
        <a th:href="@{/admin}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg> Gerenciar notícias</a>
        <a class="active" th:href="@{/cadastrarNoticia}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nova notícia</a>
        <a th:href="@{/cadastrarAutor}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg> Novo autor</a>
      </nav>
    </aside>

    <div class="admin-main">
      <div class="panel-head">
        <h1>Nova notícia</h1>
        <p>Preencha os campos para publicar uma matéria. A data de criação é registrada automaticamente.</p>
      </div>

      <form class="form-card" method="POST" th:action="@{/cadastrarNoticia}">
        <div class="form-grid">
          <div class="field full">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" class="input" type="text" placeholder="Ex.: Câmara aprova marco da inteligência artificial" required>
          </div>
          <div class="field">
            <label for="assunto">Editoria <span class="hint">(assunto)</span></label>
            <select id="assunto" name="assunto" class="select" required>
              <option value="" disabled selected>Selecione…</option>
              <option>Política</option><option>Economia</option><option>Mundo</option>
              <option>Tecnologia</option><option>Cultura</option><option>Esportes</option><option>Ciência</option>
            </select>
          </div>
          <div class="field">
            <label for="autor">Autor</label>
            <select id="autor" name="autor.id" class="select" required>
              <option value="" disabled selected>Selecione…</option>
              <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome}">Nome</option>
            </select>
          </div>
          <!-- STATUS: ADMIN escolhe; AUTOR fica travado em EM_PRODUCAO (enviado por hidden) -->
          <div class="field full" th:if="${ehAdmin}">
            <label for="status">Status inicial</label>
            <select id="status" name="status" class="select">
              <option value="EM_PRODUCAO" selected>Em produção</option>
              <option value="INATIVA">Inativa (rascunho)</option>
              <option value="CONCLUIDA">Concluída (publicar)</option>
            </select>
          </div>
          <div class="field full" th:unless="${ehAdmin}">
            <label>Status inicial</label>
            <input type="hidden" name="status" value="EM_PRODUCAO">
            <div class="status-lock">
              <span class="status-pill status-producao">Em produção</span>
              <span class="lockmsg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Sua notícia começa em produção. O admin aprova para publicar.</span>
            </div>
          </div>
          <div class="field full">
            <label for="urlImagem">URL da imagem <span class="hint">(opcional — campo novo no backend)</span></label>
            <input id="urlImagem" name="urlImagem" class="input" type="url" placeholder="https://…/foto.jpg">
          </div>
          <div class="field full">
            <label for="conteudo">Conteúdo</label>
            <textarea id="conteudo" name="conteudo" class="textarea" placeholder="Escreva o corpo da matéria…" required></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg> Publicar notícia</button>
          <a class="btn btn-ghost" th:href="@{/admin}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<th:block th:replace="~{_fragments :: footer}"></th:block>
<th:block th:replace="~{_fragments :: scripts}"></th:block>
</body>
</html>
