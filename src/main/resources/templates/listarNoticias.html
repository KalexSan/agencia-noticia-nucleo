<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" data-page="noticias"
      th:with="edMap=${ {'Política':'ed-politica','Economia':'ed-economia','Mundo':'ed-mundo','Tecnologia':'ed-tecnologia','Cultura':'ed-cultura','Esportes':'ed-esportes','Ciência':'ed-ciencia'} }">
<head th:replace="~{_fragments :: head('Notícias — NÚCLEO')}"></head>
<body>
<th:block th:replace="~{_fragments :: chrome('noticias')}"></th:block>

<main>
  <section class="wrap section-top">
    <div class="sec-head noticias-head">
      <h2>Todas as notícias</h2>
      <span class="count"
            th:text="${(noticias != null ? noticias.size() : 0)} + ' publicações'">0 publicações</span>
    </div>

    <!-- FILTRO POR AUTOR (espelha /listarNoticias?idAutor=) -->
    <form th:action="@{/listarNoticias}" method="get" class="filter-bar">
      <div class="field">
        <label for="idAutor">Filtrar por autor</label>
        <select id="idAutor" name="idAutor" class="select">
          <option value="">Todos os autores</option>
          <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome}"
                  th:selected="${autor.id == idAutorSelecionado}">Nome</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Filtrar
      </button>
      <a th:href="@{/listarNoticias}" class="btn btn-ghost" th:if="${idAutorSelecionado != null and !idAutorSelecionado.isEmpty()}">Limpar</a>
    </form>
  </section>

  <!-- GRID DE NOTÍCIAS -->
  <section class="section section-flush">
    <div class="wrap">
      <div class="grid-3" th:if="${noticias != null and !noticias.isEmpty()}">
        <article class="card reveal" th:each="n : ${noticias}">
          <a th:href="@{/detalheNoticia(idNoticia=${n.id})}">
            <div class="media">
              <img th:if="${n.urlImagem != null and !n.urlImagem.isEmpty()}" th:src="${n.urlImagem}" th:alt="${n.titulo}" class="ar-16x9">
              <div th:unless="${n.urlImagem != null and !n.urlImagem.isEmpty()}" class="ph r16x9" data-label="Foto 16:9"></div>
            </div>
            <span class="kicker" th:classappend="${edMap.containsKey(n.assunto) ? edMap.get(n.assunto) : 'ed-geral'}" th:text="${n.assunto}">Editoria</span>
            <h3 th:text="${n.titulo}">Título</h3>
            <p class="dek" th:text="${#strings.abbreviate(n.conteudo, 140)}">Resumo…</p>
            <div class="meta">
              <span class="byline" th:text="${n.autor != null ? n.autor.nome : 'Redação'}">Autor</span>
              <span class="dot"></span>
              <span th:text="${n.dataCriacao != null ? #temporals.format(n.dataCriacao, 'dd MMM yyyy') : ''}">data</span>
            </div>
          </a>
        </article>
      </div>

      <!-- ESTADO VAZIO -->
      <div class="empty-page pad-70" th:if="${noticias == null or noticias.isEmpty()}">
        <span class="kicker ed-geral centered">Sem resultados</span>
        <h3>Nenhuma notícia encontrada</h3>
        <p>Tente remover o filtro ou cadastre uma nova matéria.</p>
      </div>
    </div>
  </section>
</main>

<th:block th:replace="~{_fragments :: footer}"></th:block>
<th:block th:replace="~{_fragments :: scripts}"></th:block>
</body>
</html>
